  <line x1="541" y1="372" x2="771" y2="372" class="line"/>
  <text x="543" y="398" class="muted">TÀI CHÍNH</text>
  <text x="554" y="430" class="body">□  Đối soát QR</text>
  <text x="554" y="466" class="body">□  Mã giảm giá</text>
  <text x="554" y="502" class="body">□  Khách hàng</text>
  <text x="554" y="538" class="body">□  Tin nhắn</text>
  <line x1="541" y1="576" x2="771" y2="576" class="line"/>
  <text x="544" y="602" class="body">◯  Tài khoản</text>
  <text x="36" y="642" class="muted">Panel trượt từ trái · đóng bằng ×, Esc, nền phủ hoặc sau khi chọn mục · trả focus về nút menu</text>
