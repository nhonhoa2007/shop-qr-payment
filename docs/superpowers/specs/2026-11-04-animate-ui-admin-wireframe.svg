<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 820" role="img" aria-labelledby="title desc">
  <title id="title">Phác thảo dashboard quản trị desktop và mobile</title>
  <desc id="desc">Desktop có sidebar cố định bên trái, các KPI, biểu đồ, cơ cấu thanh toán và việc cần xử lý. Mobile có thanh trên cùng và panel điều hướng mở từ trái.</desc>
